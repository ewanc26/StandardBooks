name: StandardBooks
version: '0.1.0'
main: uk.ewancroft.standardbooks.StandardBooksPlugin
api-version: '1.21'
description: Publish and read in-game books on the AT Protocol via Standard.site.
author: ewanc26

commands:
  standardbooks:
    description: Publish and read books on the AT Protocol.
    aliases: [sbook, sb]
    permission: standardbooks.use

permissions:
  standardbooks.use:
    description: Use StandardBooks commands.
    default: true
  standardbooks.admin:
    description: Admin commands for StandardBooks.
    default: op
